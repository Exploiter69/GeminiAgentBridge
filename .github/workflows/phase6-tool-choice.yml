name: Phase 6 tool-choice verification

on:
  push:
    branches: [phase6-tool-choice]
  pull_request:
    branches: [phase4-complete-direct]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Focused Phase 6 tests
        run: python -m unittest tests.test_phase6_tool_choice -v

      - name: Full test suite
        run: python -m pytest -q

      - name: Compile check
        run: python -m compileall -q gemini_web2api scripts

      - name: Diff check
        run: git diff --check

      - name: Credential-safety source check
        run: |
          ! grep -RInE 'Authorization: Bearer [A-Za-z0-9._-]{12,}|(api[_-]?key|token|cookie|sapisid)[[:space:]]*=[[:space:]]*[A-Za-z0-9._-]{12,}' \
            gemini_web2api tests scripts --exclude='*.pyc'
