name: Phase 7 Planner Experiment

on:
  push:
    branches: [phase7-planner]
  pull_request:
    branches: [phase7-planner]

jobs:
  planner:
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused Phase 7 tests
        run: python -m unittest tests.test_phase7_planner -v
      - name: Full suite
        run: python -m unittest discover -s tests -p 'test*.py' -q
      - name: Compile
        run: python -m compileall -q gemini_web2api scripts
      - name: Diff check
        run: git diff --check
      - name: Planner benchmark
        run: python scripts/phase7_planner_benchmark.py
      - name: Credential safety source check
        run: |
          if grep -RInE '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|github_pat_[0-9A-Za-z_]{20,}|sk-[A-Za-z0-9_-]{20,})' gemini_web2api tests scripts .github; then
            echo 'Potential credential pattern found in source tree'
            exit 1
          fi
