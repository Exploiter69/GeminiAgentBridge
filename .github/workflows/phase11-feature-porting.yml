name: Phase 11 — Selective Feature Porting

on:
  push:
    branches: [phase11-feature-porting]
  pull_request:
    branches: [phase7-planner]

jobs:
  phase11:
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip
      - name: Phase 11 focused tests
        run: python -m unittest tests.test_phase11_feature_porting -v
      - name: Full test suite
        run: python -m unittest discover -s tests -p 'test*.py' -q
      - name: Compile check
        run: python -m compileall -q gemini_web2api scripts
      - name: Whitespace check
        run: git diff --check
      - name: Phase 11 benchmark
        run: python scripts/phase11_feature_porting_benchmark.py
      - name: Phase 9 regression
        run: python scripts/phase9_trajectory_benchmark.py
      - name: Phase 8 regression
        run: python scripts/phase8_compatibility_benchmark.py
      - name: Credential-pattern source scan
        shell: bash
        run: |
          ! grep -RInE '(Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{12,}|AIza[0-9A-Za-z_-]{20,}|[Ss]ession(_name)?[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._-]{20,})' \
            gemini_web2api tests scripts .github --exclude='*.md'
