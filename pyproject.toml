[project]
name = "gemini-agent-bridge"
version = "2.0.0"
description = "Gemini Web reasoning bridge with an OpenAI-compatible local API for agent clients"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.25",
  "gemini-webapi==2.1.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gemini-agent-bridge = "gemini_web2api.__main__:main"
gemini-web2api = "gemini_web2api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
